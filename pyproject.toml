[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aog-teejet-bridge"
version = "0.5.0"
description = "AgOpenGPS <-> TeeJet Radion 8140 BoomPilot section control bridge over CAN (PCAN)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Gunics BalÃ¡zs" }]
dependencies = ["python-can>=4.2"]

[project.optional-dependencies]
dev = ["pytest>=7"]
build = ["pyinstaller>=6"]

[project.scripts]
teejet-bridge = "teejet_bridge.cli:main"

[tool.setuptools]
packages = ["teejet_bridge"]

[tool.setuptools.package-data]
teejet_bridge = ["lang/*.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
