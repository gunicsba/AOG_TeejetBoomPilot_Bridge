name: Build AOG-TeejetBoomPilot

# Push a tag like v0.1.0 to build the exe and publish a GitHub release.
# "Run workflow" (manual) builds the exe as a downloadable artifact only.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,build]

    - name: Run tests
      run: python -m pytest -q

    - name: Build AOG-TeejetBoomPilot
      run: |
        $ICON_FLAG = @()
        if (Test-Path "icon.ico") { $ICON_FLAG = @("--icon=icon.ico") }
        python -m PyInstaller --noconfirm --onefile --noconsole --name AOG-TeejetBoomPilot `
          --collect-submodules can.interfaces --add-data "teejet_bridge/lang;teejet_bridge/lang" `
          @ICON_FLAG teejet_bridge_app.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AOG-TeejetBoomPilot
        path: dist/AOG-TeejetBoomPilot.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/AOG-TeejetBoomPilot.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
